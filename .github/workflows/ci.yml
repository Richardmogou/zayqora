name: ZAYQORA CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-qa:
    name: Backend Migrations & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqarflow
          POSTGRES_PASSWORD: aqarflow_dev
          POSTGRES_DB: aqarflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare test schema and verify Alembic single head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://aqarflow:aqarflow_dev@127.0.0.1:5433/aqarflow_test?options=-csearch_path%3Dzayqora
        run: |
          python -c "from sqlalchemy import create_engine, text; e = create_engine('postgresql+psycopg://aqarflow:aqarflow_dev@127.0.0.1:5433/aqarflow_test'); conn = e.connect(); conn.execute(text('CREATE SCHEMA IF NOT EXISTS zayqora')); conn.commit()"
          alembic heads
          alembic upgrade head --sql > /dev/null
      - name: Run full pytest suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aqarflow:aqarflow_dev@127.0.0.1:5433/aqarflow_test?options=-csearch_path%3Dzayqora
        run: pytest -v -p no:cacheprovider

  frontend-qa:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck
      - name: Next.js production build
        working-directory: frontend
        run: npm run build
